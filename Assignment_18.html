<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission 2026 | ~CrishPy</title>
    <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
    }
    header, footer {
      background-color: #1a237e;
      color: white;
      text-align: center;
      padding: 15px;
    }
    main {
      padding: 20px 60px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    th, td {
      border: 1px solid #999;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #e8eaf6;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>ABC College Admission 2026</h1>
  </header>
  <main>
    <h2>Courses and Fees</h2>
    <table>
      <caption>Available Courses</caption>
      <thead>
        <tr>
          <th>Course</th>
          <th>Seats</th>
          <th>Fees</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>B.Tech CSE</td>
          <td>120</td>
          <td>&#8377;90,000</td>
        </tr>
        <tr>
          <td>BCA</td>
          <td>60</td>
          <td>&#8377;45,000</td>
        </tr>
      </tbody>
    </table>
    <form action="#" method="post">
      <fieldset>
        <legend>Application Form</legend>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>
        <label for="course">Course:</label><br>
        <select id="course" name="course">
          <option value="btech">B.Tech CSE</option>
          <option value="bca">BCA</option>
        </select><br><br>
        <label for="statement">Statement:</label><br>
        <textarea id="statement" name="statement" rows="4" cols="45" required></textarea><br><br>
        <button type="submit">Apply</button>
      </fieldset>
    </form>
  </main>
  <footer>
    <p>&copy; 2026 ABC College</p>
  </footer>    
</body>
</html>
