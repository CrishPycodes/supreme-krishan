<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Elements | ~CrishPy</title>
</head>
<body>
  <h4>Image</h4>
  <img src="campus.jpg" alt="College campus" width="150" height="120">
  <h4>Video</h4>
  <video width="200" controls>
    <source src="sample.mp4" type="video/mp4">
  </video>
  <h4>Audio</h4>
  <audio controls>
    <source src="sample.mp3" type="audio/mpeg">
  </audio>
  <h4>YouTube</h4>
  <iframe width="300" height="170" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video"></iframe> 
</body>
</html>
